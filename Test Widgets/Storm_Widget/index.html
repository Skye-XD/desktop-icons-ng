<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Storm Widget</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --panel: #1f2937;
      --muted: #9ca3af;
      --text: #f9fafb;
      --accent: #f97316;
      --ok: #10b981;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: "Noto Sans", sans-serif;
      color: var(--text);
    }

    body {
      padding: 10px;
    }

    #root {
      display: grid;
      gap: 10px;
      height: 100%;
      padding: 14px;
      border-radius: 18px;
      background:
        radial-gradient(circle at top right, rgba(249, 115, 22, 0.24), transparent 28%),
        linear-gradient(180deg, rgba(31, 41, 55, 0.98), rgba(17, 24, 39, 0.98));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .card {
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
    }

    .label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .value {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 700;
    }

    .status {
      align-self: end;
      padding: 10px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.08);
      color: var(--ok);
      font-size: 12px;
      line-height: 1.4;
      min-height: 54px;
    }
  </style>
</head>
<body>
  <div id="root">
    <div>
      <div class="title">Storm Widget</div>
      <div class="subtitle">Starts a short startup burst of host messages and local SVG requests to exercise host-side guardrails.</div>
    </div>

    <div class="stats">
      <div class="card">
        <div class="label">Config saves</div>
        <div class="value" id="configCount">0</div>
      </div>
      <div class="card">
        <div class="label">SVG fetches</div>
        <div class="value" id="fetchCount">0</div>
      </div>
      <div class="card">
        <div class="label">Full SVGs</div>
        <div class="value" id="fullCount">0</div>
      </div>
      <div class="card">
        <div class="label">Quiet 200s</div>
        <div class="value" id="quietCount">0</div>
      </div>
      <div class="card">
        <div class="label">Fetch failures</div>
        <div class="value" id="failedCount">0</div>
      </div>
    </div>

    <div class="status" id="status">Starting storm…</div>
  </div>

  <script type="module" src="./storm.js"></script>
</body>
</html>
